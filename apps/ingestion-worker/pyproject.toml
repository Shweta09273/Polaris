[project]
name = "polaris-ingestion-worker"
version = "0.1.0"
description = "POLARIS ingestion mesh worker (Prefect flows) — Milestone 1 scaffold"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
